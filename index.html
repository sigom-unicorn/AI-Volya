<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сайт Воли // Исполнительный Рантайм (JSON Протокол)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0d1117; color: #e0e6ed; height: 100vh; display: flex; overflow: hidden;
        }
        #chat-sidebar {
            width: 33.333%; border-right: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(20, 24, 33, 0.95); display: flex; flex-direction: column; height: 100%; z-index: 10;
        }
        #chat-header { padding: 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); font-weight: bold; color: #fff; display: flex; justify-content: space-between; align-items: center; }
        .json-badge { font-size: 10px; background: rgba(56, 189, 248, 0.15); color: #38bdf8; padding: 2px 8px; border-radius: 6px; border: 1px solid rgba(56, 189, 248, 0.3); }
        #chat-messages { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .message { padding: 12px 16px; border-radius: 12px; max-width: 85%; line-height: 1.5; font-size: 14px; }
        .message.user { background: #0044ff; color: #fff; align-self: flex-end; }
        .message.assistant { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); align-self: flex-start; }
        #chat-input-area { padding: 20px; border-top: 1px solid rgba(255, 255, 255, 0.08); display: flex; gap: 12px; }
        #message-input { flex-grow: 1; background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; padding: 12px; color: #fff; font-size: 14px; outline: none; }
        #message-input:focus { border-color: #00ffcc; }
        #send-btn { background: #00ffcc; color: #0d1117; border: none; border-radius: 8px; padding: 0 20px; font-weight: bold; cursor: pointer; }
        #send-btn:hover { background: #00ccaa; box-shadow: 0 0 10px rgba(0, 255, 204, 0.3); }
        #viewport { width: 66.666%; height: 100%; position: relative; overflow: auto; display: flex; justify-content: center; align-items: center; padding: 24px; }
        .canvas-placeholder { text-align: center; padding: 40px; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; backdrop-filter: blur(8px); max-width: 450px; }
        
        .glass-window {
            width: 100%; height: 100%; background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px;
            backdrop-filter: blur(14px); padding: 24px; display: flex; flex-direction: column; gap: 16px;
        }
        .glass-title { color: #00ffcc; font-family: monospace; font-size: 16px; font-weight: bold; }
        .glass-content-box { 
            background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px; padding: 16px; overflow: auto; flex-grow: 1;
        }
        .code-view { margin: 0; color: #e0e6ed; font-family: 'Courier New', monospace; font-size: 13px; white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body>

    <div id="chat-sidebar">
        <div id="chat-header">
            <span>Диалог с Эйрой // РАНТАЙМ</span>
            <span class="json-badge">JSON Protocol</span>
        </div>
        <div id="chat-messages"></div>
        <div id="chat-input-area">
            <input type="text" id="message-input" placeholder="Направьте вашу волю..." autocomplete="off">
            <button id="send-btn">Отправить</button>
        </div>
    </div>

    <div id="viewport">
        <div class="canvas-placeholder">
            <h3 style="color: #00ffcc; margin-bottom: 12px; font-family: monospace;">Живое Древо Воли (JSON)</h3>
            <p style="font-size: 13px; color: rgba(255,255,255,0.6); line-height: 1.6;">
                Рантайм работает по суверенному JSON-протоколу. Отправьте сообщение для старта.
            </p>
        </div>
    </div>

    <script>
        const messagesContainer = document.getElementById('chat-messages');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const viewport = document.getElementById('viewport');
        
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws`);

        function appendMessage(role, text) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', role);
            msgDiv.innerText = text;
            messagesContainer.appendChild(msgDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function renderCanvas(canvasType, canvasContent) {
            if (!canvasContent || canvasContent.trim() === "") return;

            if (canvasType === "load_tmp") {
                const fileName = canvasContent.substring(9).trim();
                fetch(`/tmp/${fileName}?t=${Date.now()}`)
                    .then(res => {
                        if (!res.ok) throw new Error(`Статус: ${res.status}`);
                        return res.text();
                    })
                    .then(fileContent => buildGlassWindow(`Инспекция файла: ${fileName}`, fileContent, true))
                    .catch(err => {
                        viewport.innerHTML = `<div style="padding:20px; color:#ef4444;">Ошибка загрузки файла: ${err.message}</div>`;
                    });
            } else if (canvasType === "html") {
                buildGlassWindow("Холст Воли // HTML Вид", canvasContent, true);
            } else if (canvasType === "text") {
                buildGlassWindow("Инспекция данных Кона // Текст", canvasContent, false);
            } else {
                // Если передан скрипт или нетипизированный контент
                try {
                    const runScript = new Function(canvasContent);
                    runScript();
                } catch (err) {
                    buildGlassWindow("Холст Воли // Вывод", canvasContent, false);
                }
            }
        }

        function buildGlassWindow(titleText, contentText, isHtml = false) {
            viewport.innerHTML = '';
            
            const windowDiv = document.createElement('div');
            windowDiv.className = 'glass-window';
            
            const titleH2 = document.createElement('div');
            titleH2.className = 'glass-title';
            titleH2.innerText = titleText;
            
            const boxDiv = document.createElement('div');
            boxDiv.className = 'glass-content-box';
            
            if (isHtml) {
                boxDiv.innerHTML = contentText;
            } else {
                const preElement = document.createElement('pre');
                preElement.className = 'code-view';
                preElement.textContent = contentText;
                boxDiv.appendChild(preElement);
            }
            
            windowDiv.appendChild(titleH2);
            windowDiv.appendChild(boxDiv);
            viewport.appendChild(windowDiv);
        }

        ws.onmessage = function(event) {
            try {
                const data = JSON.parse(event.data);

                if (data.type === 'reply') {
                    if (data.chat_text) appendMessage('assistant', data.chat_text);
                    renderCanvas(data.canvas_type, data.canvas_content);
                } 
                else if (data.type === 'restore') {
                    messagesContainer.innerHTML = '';
                    if (data.history) {
                        data.history.forEach(msg => {
                            appendMessage(msg.role, msg.text);
                        });
                    }
                    renderCanvas(data.canvas_type, data.canvas_content);
                }
            } catch (err) {
                console.error("[JSON ПАРСЕР СБОЙ]:", err, event.data);
            }
        };

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;
            
            appendMessage('user', text);
            
            // Отправляем структурированный JSON-пакет на бэкенд
            ws.send(JSON.stringify({ chat_text: text }));
            messageInput.value = '';
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.endswith = messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
